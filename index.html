<!doctype html>
<style>#start{z-index:2}</style>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadow Hand Teleop</title><style>body{margin:0;background:#060a10;color:#dce8f5;font:14px system-ui}main{max-width:1200px;margin:auto;padding:24px}#grid{display:grid;grid-template-columns:300px 1fr;gap:16px}.panel{background:#0c1420;border:1px solid #293a50;border-radius:12px;overflow:hidden}.title{padding:12px;color:#8cc8ff;font-size:11px;letter-spacing:.13em}#camera{position:relative;aspect-ratio:4/3;background:#000}video,canvas{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}button{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:10px 16px;border-radius:20px;border:1px solid #69dfd0;background:#10383c;color:white}#view{height:600px}.status{padding:12px;color:#9bb0c8}@media(max-width:700px){#grid{grid-template-columns:1fr}#view{height:400px}}</style></head><body><main><p style="color:#80bfff;letter-spacing:.12em">BROWSER-NATIVE TELEOPERATION</p><h1>Shadow Hand ↔ Your Hand</h1><p>MediaPipe tracking and WebGL rendering run locally. No webcam frames are uploaded.</p><div id="grid"><section class="panel"><div class="title">INPUT · LOCAL MEDIAPIPE</div><div id="camera"><video id="video" playsinline muted></video><canvas id="overlay"></canvas><button id="start">Enable camera</button></div><div class="status" id="status">Camera disabled</div></section><section class="panel"><div class="title">OUTPUT · LOCAL WEBGL</div><div id="view"></div><div class="status">Drag to orbit · scroll to zoom · <span id="fps">— FPS</span></div></section></div></main><script type="module" src="web/app.js"></script></body></html>
